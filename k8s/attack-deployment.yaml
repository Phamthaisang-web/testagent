apiVersion: apps/v1
kind: Deployment
metadata:
  name: attack-injector-app
  namespace: test-lab
  labels:
    app: attack-injector-app
    tier: redteam-injector
spec:
  replicas: 1
  selector:
    matchLabels:
      app: attack-injector-app
  template:
    metadata:
      labels:
        app: attack-injector-app
        tier: redteam-injector
    spec:
      containers:
        - name: attack-injector
          image: selfheal-attack-injector:1.0.0
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
              name: http
          env:
            - name: PORT
              value: "8080"
            - name: TARGET_URL
              value: "http://ecommerce-store-service:8080"
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 1000m
              memory: 512Mi
          livenessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 15
            timeoutSeconds: 8
            failureThreshold: 5
          readinessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 4
---
apiVersion: v1
kind: Service
metadata:
  name: attack-injector-service
  namespace: test-lab
  labels:
    app: attack-injector-app
spec:
  type: NodePort
  selector:
    app: attack-injector-app
  ports:
    - name: http
      port: 8080
      targetPort: 8080
      nodePort: 30896
