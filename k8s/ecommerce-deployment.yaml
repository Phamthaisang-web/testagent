apiVersion: apps/v1
kind: Deployment
metadata:
  name: ecommerce-store-app
  namespace: test-lab
  labels:
    app: ecommerce-store-app
    app.kubernetes.io/name: ecommerce-store-app
    tier: business-frontend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: ecommerce-store-app
  template:
    metadata:
      labels:
        app: ecommerce-store-app
        app.kubernetes.io/name: ecommerce-store-app
        tier: business-frontend
    spec:
      containers:
        - name: store-server
          image: selfheal-ecommerce-store:1.0.0
          imagePullPolicy: IfNotPresent
          env:
            - name: MONGODB_URI
              value: "mongodb://mongodb-0.mongodb-service.test-lab.svc.cluster.local:27017,mongodb-1.mongodb-service.test-lab.svc.cluster.local:27017/ecommerce_db?replicaSet=rs0&readPreference=primaryPreferred&retryWrites=true&w=majority&serverSelectionTimeoutMS=5000"
          ports:
            - containerPort: 8080
              name: http
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 512Mi
          livenessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 15
            periodSeconds: 10
            timeoutSeconds: 10
            failureThreshold: 8
          readinessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 5
            timeoutSeconds: 8
            failureThreshold: 5
---
apiVersion: v1
kind: Service
metadata:
  name: ecommerce-store-service
  namespace: test-lab
  labels:
    app: ecommerce-store-app
spec:
  type: NodePort
  selector:
    app: ecommerce-store-app
  ports:
    - port: 8080
      targetPort: 8080
      nodePort: 30895
      name: http
